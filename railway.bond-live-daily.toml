# bond-live-daily (WORKER=bond_live_daily) - DEDICATED Railway config for the ONE service
# that publishes the daily bond chain, including the implied-rating product (stage 7).
#
# Attach this file ONLY to the `bond-live-daily` service (project investintell-db, env
# production; service id e673db8e-...). Every other worker service keeps the shared root
# railway.toml (Nixpacks from the unpinned root requirements.txt). Pointing the service at
# this file replaces its build with docker/bond-live-daily/Dockerfile: python:3.13.12-slim
# pinned by digest and a sha256-locked wheel set (numpy 2.5.1 / pandas 3.0.3 / scipy 1.18.0
# / pyarrow 25.0.0 / psycopg 3.3.3 + the full closure of the root requirements), so the
# production numeric stack is a reviewed input of every publication instead of whatever
# Nixpacks resolved on build day. This is the "pinned Workers deps + stack in build
# manifest" gate of DG-4 Phase 4 (docs/runbooks/bond-market-implied-rating-republication.md).
#
# Behaviour is otherwise IDENTICAL to the shared config: same start command
# (src.run_worker resolves WORKER), same restart policy, and the same cron the service
# already runs on (`30 7 * * *` UTC: docs/runbooks/bond-live-daily.md and the root
# railway.toml both record 07:30 UTC, ~2h ahead of the 11:00 bond-chain). Service
# variables are unchanged: WORKER=bond_live_daily, DATABASE_URL, FINNHUB_API_KEY, optional
# WORKER_LIMIT / WORKER_CALC_DATE / BOND_TICK_TOP_N / BOND_IMPLIED_RATING_ENABLED /
# BOND_IMPLIED_RATING_FORCE_REPUBLISH (see the runbook). The service MUST still deploy
# from the GitHub source: RAILWAY_GIT_COMMIT_SHA is the code revision (no .git in the
# image; "unknown" refuses to publish).
#
# Deploying this file is an OPERATOR step requiring explicit owner authorization: it
# changes the production image of a publishing service. A deploy is NOT a one-shot
# execution here (unlike the artifact loader): the cron keeps firing the daily worker.
# A one-off replay/determinism run uses `railway run` / a manual service restart with the
# documented variables, never a change to this file.
#
# Railway rejects linking config-as-code files for NEW services; for an existing service
# set "Config-as-code file path" to this file in the service settings. Verify a deploy in
# the tables and in the run JSON's `build_manifest` (python 3.13.12, numpy 2.5.1, lock
# sha256 == docker/bond-live-daily/requirements.lock.sha256), never on the deploy status.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/bond-live-daily/Dockerfile"

[deploy]
startCommand = "python -m src.run_worker"
restartPolicyType = "never"
cronSchedule = "30 7 * * *"
