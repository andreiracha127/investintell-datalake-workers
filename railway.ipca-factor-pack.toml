# Railway config for the governed IPCA production rebuild. The characteristics
# service runs upstream at 05:00 UTC; this pack starts at 06:00 UTC and fails
# closed unless that upstream computed_at is recent.
[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m scripts.rebuild_ipca_factor_pack"
restartPolicyType = "never"
cronSchedule = "0 6 2 * *"
