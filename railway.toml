# Railway deploy config — ONE SERVICE PER WORKER.
# All services deploy this same repo. Each service sets:
#   WORKER=risk_metrics | characteristics | factor_model | nport_lookthrough
#         | credit_regime | macro_ingestion | treasury_ingestion
#         | benchmark_ingest | instrument_ingestion        (selects the worker)
#   DATABASE_URL=<cloud DSN>                                (shared)
# and its own Cron Schedule (set per-service in dashboard/CLI):
#   risk_metrics      -> daily   (NAV is daily)
#   characteristics   -> monthly day 2 at 05:00 UTC.
#   factor_model/fund_factors -> unscheduled; sequenced by the governed IPCA
#                           pack at 06:00 UTC after characteristics.
#   nport_lookthrough -> weekly  (N-PORT é mensal/trimestral; dom 04:00 UTC)
#   credit_regime     -> daily 06:30 UTC (2 req Tiingo; precisa TIINGO_API_KEY)
#   regime_composite  -> daily ~06:40 UTC (after credit_regime; needs FRED_API_KEY + Tiingo)
#   regime_gate       -> daily ~06:50 UTC (self-contained: fetches SPY/HYG/IEF/TIP via
#                        Tiingo; needs TIINGO_API_KEY). Schedule AFTER regime_composite and
#                        BEFORE the backend portfolio_drift_daily run so its flip-read sees
#                        a fresh gate. WORKER=regime_gate; backfill once via
#                        `python -m src.run regime_gate`.
# Ingestion (docs/INGESTION_DESIGN.md §2 — order by cron offsets):
#   macro_ingestion      -> daily 05:00 UTC (needs FRED_API_KEY)
#   treasury_ingestion   -> daily 05:00 UTC
#   benchmark_ingest     -> daily 05:30 UTC (needs TIINGO_API_KEY)
#   instrument_ingestion -> daily 06:00 UTC, stale-only AUM-prioritised sweep
#                           (needs TIINGO_API_KEY; before risk_metrics 07:00)
#   eod_prices_warmer    -> daily 06:15 UTC, refreshes eod_prices for the stock/
#                           ETF universe the API serves DB-first (Strategy B).
#                           Incremental (max(date)−5d → today); needs
#                           TIINGO_API_KEY. Keep cadence < eod_staleness_hours
#                           (API default 24h) so /stocks/* never serves stale.
#   screener_metrics     -> daily after eod_prices_warmer; computes price-derived
#                           fields from eod_prices and fundamentals directly from
#                           company_characteristics_monthly, then refreshes
#                           screener_equity_snapshot_mv for the Light API.
#   open_macro_v03       -> daily 08:30 UTC. DEPOIS do eod_prices_warmer (06:15,
#                           ~55 min): o staleness gate lê eod_prices dos 6 ETFs
#                           do book (SLO 3 dias úteis). Com ambos às 07:00 o
#                           worker leu preços velhos e 2026-07-17 ficou sem
#                           decisão publicada (builder sem sinal). Margem até o
#                           valid_until do par anterior (14:00 UTC): 5h30.
#   open_macro_v03_monitor -> daily 09:30 UTC, DEPOIS da janela de publicação
#                           do worker, para alertar missing_output_slo no
#                           mesmo dia (às 07:00 avaliava antes do worker rodar).
#   open_macro_v04       -> DARK RUN. Motor v4.0-rev (M-COMP4), cadência MENSAL
#                           publicada por um cron DIÁRIO idempotente nas tabelas
#                           IRMÃS open_macro_v04_decisions/_allocations. NÃO
#                           substitui o open_macro_v03: as duas rodam lado a
#                           lado, em tabelas disjuntas e locks distintos
#                           (900_215 vs 900_218), até o dono ratificar o
#                           artefato e o Light ser virado para consumir o v4.
#                           Ordem obrigatória: macro_ingestion (05:00, mantém
#                           MTSDS133FMS/GDP/M2SL/SUBLPDCILSLGNQ) e
#                           eod_prices_warmer (06:15, aquece SPY..LQD) ANTES —
#                           sugestão 08:45 UTC, depois do v03 (08:30). O DDL é
#                           aplicado pelo OPERADOR (schemas/open_macro_v04_*.sql);
#                           o worker só verifica o catálogo, read-only.
#                           Este arquivo NÃO cria o serviço: criar/agendar é
#                           passo operacional (docs/open_macro_v4_runbook.md).
#   open_macro_v03_chain -> DIÁRIO 07:45 UTC. Produtor APPEND-ONLY da
#                           open_macro_v03_decision_chain: publica NO MÁXIMO o
#                           próximo mês faltante por run e NUNCA reescreve um mês
#                           já publicado (INSERT ... ON CONFLICT (as_of) DO
#                           NOTHING; não existe DELETE nem UPDATE no módulo). A
#                           revisão de história continua sendo o script manual
#                           scripts/rebuild_decision_chain_v3.py, sob ordem do
#                           dono. ORDEM OBRIGATÓRIA no dia: macro_ingestion
#                           (05:00) e eod_prices_warmer (06:15) ANTES — são os
#                           insumos; e open_macro_v04 (08:45) DEPOIS, para que o
#                           v04 do dia leia o mês novo em vez de carregar o mês
#                           anterior por chain_carry. 07:45 fica no meio da
#                           janela e ainda deixa 1h de folga se a ingestão
#                           atrasar. Rodar diariamente é seguro e barato de
#                           raciocinar: em quase todo dia o run é um no-op — ou o
#                           mês corrente ainda não fechou, ou algum braço ainda
#                           não publicou depois do corte. Custo de um run que
#                           publica: ~2 min (a série é encadeada, então o mês
#                           novo exige reproduzir o prefixo inteiro).
#                           Env: WORKER=open_macro_v03_chain, DATABASE_URL
#                           (datalake `market`). Sem variáveis próprias.
#                           WORKER_LIMIT/WORKER_CALC_DATE NÃO se aplicam (o
#                           run_worker aborta se forem setadas, de propósito).
#                           O DDL NÃO é aplicado por este worker: a tabela é o
#                           contrato que o open_macro_v04 e o Light leem, e o
#                           worker só verifica o catálogo, read-only, e falha
#                           alto. Verificação de um run: SEMPRE na tabela
#                           (docs/open_macro_v03_chain_runbook.md §4) — um deploy
#                           verde só significa que o contêiner subiu.
#   nport_fixed_income_serving -> SEM CRON, de propósito. Disparar junto com uma
#                           ingestão N-PORT nova, nunca em agenda fixa. A fonte
#                           são 36 campos de nport_fund_reported_info_raw, e
#                           produção PODA a raw assim que o run é atestado — o
#                           ciclo é ingere, constrói, atesta, poda. Um cron
#                           semanal (o que o Cloud Scheduler fazia) reencontra o
#                           mesmo run já podado em 12 semanas de 13, e o worker
#                           recusa construir, corretamente: em 2026-08-01 um
#                           build sobre raw podada publicou quatro das oito
#                           relações VAZIAS e passou por bem-sucedido. Recusar
#                           não é falha, é repouso.
#   bond_live_daily      -> DIÁRIO 07:30 UTC, serviço `bond-live-daily`
#                           (e673db8e-…). Carrega o dia (candles por CUSIP na
#                           bond_observation_daily, curva em
#                           bond_yield_curve_daily, tape do pregão anterior em
#                           bond_tick_daily), refresca a matview curada e
#                           REPUBLICA (bond_metrics + bond_serving).
#                           ORDEM OBRIGATÓRIA: ANTES da bond-chain (11:00). A
#                           varredura + republicação leva ~80 min, então 07:30
#                           deixa ~2h de folga; as duas não se corrompem (locks
#                           distintos), mas sobrepor paga a mesma publicação
#                           duas vezes.
#                           A republicação NÃO é redundante com a chain: a
#                           daily_chain indexa um run por (chain, source_day,
#                           code_revision, config_version) e devolve o resumo de
#                           um run COMPLETO sem re-executar, e o source_day sai
#                           de watermarks que não se movem quando candles
#                           chegam — num dia sem deploy e sem filing a chain não
#                           executaria nada. Ver docs/runbooks/bond-live-daily.md.
#                           Env: WORKER=bond_live_daily, DATABASE_URL,
#                           FINNHUB_API_KEY (sem ela o run reporta no_api_key e
#                           não escreve nada). Opcionais: WORKER_LIMIT (teto do
#                           universo por run), WORKER_CALC_DATE (replay),
#                           BOND_TICK_TOP_N (default 500).
#   fund_peer_groups     -> TRIMESTRAL. Publica UMA âncora (o último trimestre
#                           FECHADO) em fund_peer_groups_v1, atômico: DELETE da
#                           âncora + INSERT. Cron sugerido:
#                           `0 7 15 2,5,8,11 *` (dia 15 dos meses 2/5/8/11,
#                           07:00 UTC) — DEPOIS da ingestão N-PORT do trimestre,
#                           que é o que a regra de universo "último report <=
#                           âncora, defasagem máx. 4m15d" exige. Rodar antes
#                           disso não quebra: o guard de identificador e os
#                           pisos de elegibilidade recusam a publicação em vez
#                           de publicar um trimestre meio ingerido.
#                           NUNCA usar cronSchedule null nem "": no Railway
#                           `null` significa RODAR CONTÍNUO e "" envenena o
#                           patch inteiro do serviço. Para desligar, use uma
#                           data impossível (`0 0 29 2 *`).
#                           Env: WORKER=fund_peer_groups, DATABASE_URL (datalake
#                           `market`). Opcionais (as três primeiras são a
#                           política de teto medida e entram no params_sha256):
#                           FUND_PEER_GROUPS_SIZE_CAP (default 0.08),
#                           FUND_PEER_GROUPS_CAP_WAIVE_MIN_MEDIAN (default 0.10
#                           — dispensa do teto por coesão; o teto nunca esteve
#                           errado no valor, esteve errado em ser cego à coesão),
#                           FUND_PEER_GROUPS_CAP_WAIVE_HARD_CEILING (default
#                           0.20 — NUNCA dispensado),
#                           FUND_PEER_GROUPS_IDENT_FLOOR (default 0.95),
#                           FUND_PEER_GROUPS_ANCHOR (backfill de uma âncora),
#                           FUND_PEER_GROUPS_UNIVERSE_DSN (só se os read-models
#                           servidos não estiverem no mesmo banco).
#                           Recursos: a matriz de sobreposição é n x n float32
#                           (~200 MB em 7k séries) e o grafo do bloco de equity
#                           tem ~1,5M arestas — dimensionar o serviço com >= 4 GB.
#                           O DDL é aplicado pelo OPERADOR
#                           (schemas/fund_peer_groups_v1.sql); o worker só
#                           verifica o catálogo, read-only, e falha alto.
#                           Este arquivo NÃO cria o serviço: criar/agendar é
#                           passo operacional (docs/fund_peer_groups_runbook.md).
#
# nixpacks auto-detects Python via requirements.txt.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m src.run_worker"
restartPolicyType = "never"
# Per-service schedules are configured in Railway. IPCA is orchestrated by
# railway.ipca-factor-pack.toml and never scheduled through this shared file.
