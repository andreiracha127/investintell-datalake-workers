name: preactivation-evidence

# Frozen pre-activation evidence replay.
#
# These suites validate artifacts produced by a governance phase that has already
# completed and been ratified (shadow, shadow pilot, external executor handshake,
# controlled shadow, controlled activation proposal, dark launch, A5 preflight,
# runtime integration skeleton, direct-activation plan). Their pins are `Final`
# constants over one historical bundle, so they can never fail for a reason a new
# commit caused — which is exactly why they do not belong in the per-PR gate.
#
# Nothing is deleted or archived: the modules and their tests stay live and
# replayable. They run here, on demand (and once a week so bit-rot is caught),
# instead of on every pull request that touches anything under `src/`.
#
# Run before: a release cut, a reactivation/migration audit, or any change to the
# evidence modules themselves (src/controlled_shadow.py, src/shadow_pilot.py,
# src/external_executor_handshake.py) or their artifact trees under artifacts/a5/.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — bit-rot canary, not a gate.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preactivation-evidence:
    name: preactivation-evidence
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.quant-engine.lock pytest pytest-xdist==3.8.0

      - name: Replay pre-activation evidence
        run: >-
          python -m pytest
          tests/test_shadow_readiness.py
          tests/test_shadow_pilot.py
          tests/test_a5_preflight_readiness.py
          tests/test_runtime_integration_skeleton.py
          tests/test_external_executor_handshake.py
          tests/test_controlled_shadow.py
          tests/test_controlled_activation_proposal.py
          tests/test_dark_launch_readiness.py
          tests/test_direct_activation_plan.py
          tests/test_direct_activation_stage_a.py
          -p xdist.plugin
          -n auto
          --dist loadscope
          --color=no
          -q
