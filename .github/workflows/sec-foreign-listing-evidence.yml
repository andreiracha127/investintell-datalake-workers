name: SEC foreign listing evidence

on:
  pull_request:
    paths:
      - '.github/workflows/sec-foreign-listing-evidence.yml'
      - 'requirements.txt'
      - 'schemas/sec_foreign_listing_evidence*'
      - 'schemas/sec_foreign_equity_sizing*'
      - 'schemas/sec_ticker_cik_history*'
      - 'scripts/*sec_foreign_listing*'
      - 'scripts/sec_provider_transport.py'
      - 'scripts/sec_parse_resources.py'
      - 'tests/test_sec_foreign_listing*'
      - 'tests/test_sec_foreign_equity_sizing*'
      - 'tests/test_sec_provider_transport.py'
      - 'tests/fixtures/sec_foreign_listing_evidence/**'
      - 'tests/fixtures/sec_foreign_equity_sizing/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-foreign-listing-evidence.yml'
      - 'requirements.txt'
      - 'schemas/sec_foreign_listing_evidence*'
      - 'schemas/sec_foreign_equity_sizing*'
      - 'schemas/sec_ticker_cik_history*'
      - 'scripts/*sec_foreign_listing*'
      - 'scripts/sec_provider_transport.py'
      - 'scripts/sec_parse_resources.py'
      - 'tests/test_sec_foreign_listing*'
      - 'tests/test_sec_foreign_equity_sizing*'
      - 'tests/test_sec_provider_transport.py'
      - 'tests/fixtures/sec_foreign_listing_evidence/**'
      - 'tests/fixtures/sec_foreign_equity_sizing/**'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.27.2-pg18
        env:
          POSTGRES_PASSWORD: local_w1c_ci
          POSTGRES_DB: w1c_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d w1c_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTEST_WORKERS: '2'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SEC_TEST_DATABASE_URL: postgresql://postgres:local_w1c_ci@127.0.0.1:55439/w1c_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install pytest 'psycopg[binary]>=3.2' 'pypdf>=6,<7'
      - name: Run one focused file at a time
        run: |
          python -m pytest tests/test_sec_foreign_listing_evidence.py -q
          python -m pytest tests/test_sec_foreign_listing_loader.py -q
          python -m pytest tests/test_sec_foreign_equity_sizing_core.py -q
          python -m pytest tests/test_sec_foreign_equity_sizing.py -q
          python -m pytest tests/test_sec_foreign_equity_sizing_review.py -q
          python -m pytest tests/test_sec_foreign_equity_sizing_fuzz.py -q
          python -m pytest tests/test_sec_foreign_equity_sizing_real.py -q
          python -m pytest tests/test_sec_provider_transport.py -q
          python -m pytest tests/test_sec_foreign_listing_throughput.py -q
          python -m pytest tests/test_sec_foreign_listing_shard_plans.py -q
