            scope_failed=$( (grep -Eo '[0-9]+ failed' "$scope-results.log" || true) | awk '{sum += $1} END {print sum + 0}')
            scope_executed=$((scope_passed + scope_failed))
            printf 'database_scope_%s_executed_count=%s database_scope_%s_failures=%s\n' "$scope" "$scope_executed" "$scope" "$scope_failed"
            test "$scope_status" -eq 0
            test "$scope_executed" -gt 0
