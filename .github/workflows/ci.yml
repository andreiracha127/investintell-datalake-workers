name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workers-new-surfaces-no-dsn:
    name: workers-new-surfaces-no-dsn
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements.quant-engine.lock pytest

      - name: Compile mixed production modules
        run: >-
          python -m compileall -q
          scripts/verify_mixed_quant_contract.py
          scripts/sync_sec_regulatory_contract.py
          scripts/compose_fund_regulatory_serving_mappings.py
          scripts/verify_class_mappings_secapi.py
          scripts/verify_sec_regulatory_contract.py
          src/bonds
          src/db.py
          src/ncen
          src/nport
          src/quant_data
          src/rr1
          src/run.py
          src/run_worker.py
          src/sec_regulatory
          src/sec_serving
          src/workers/bond_curves.py
          src/workers/bond_metrics.py
          src/workers/bond_price_eligibility.py
          src/workers/bond_price_ingest.py
          src/workers/bond_price_observations.py
          src/workers/bond_rating_history.py
          src/workers/bond_security_master.py
          src/workers/bond_serving.py
          src/workers/bond_source_qualify.py
          src/workers/daily_publication_chain.py
          src/workers/mixed_quant_publication.py
          src/workers/ncen_ingestion.py
          src/workers/nport_holdings_identity_freshness.py
          src/workers/nport_ingestion.py
          src/workers/nport_v2_lookthrough.py
          src/workers/rr1_derived_profiles.py
          src/workers/rr1_ingestion.py
          src/workers/sec_class_factors.py
          src/workers/sec_class_peers_scoring.py
          src/workers/sec_class_shadow_readiness.py
          src/workers/sec_regulatory_serving.py

      - name: Run mixed tests without a database DSN
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_mixed_quant_contract_version.py
            tests/test_mixed_quant_contracts.py
            tests/test_mixed_quant_factor_inputs.py
            tests/test_mixed_quant_integration_fixture.py
            tests/test_mixed_quant_native_sources.py
            tests/test_mixed_quant_publication.py
            tests/test_mixed_quant_retention.py
            tests/test_nport_ingestion.py
            tests/test_nport_v2_lookthrough.py
            tests/test_sec_class_factors.py
            tests/test_sec_class_peers_scoring.py
            tests/test_sec_class_shadow_readiness.py
            tests/bonds/test_bonds_db_free.py
            tests/bonds/test_cashflows.py
            tests/bonds/test_cashflows_db_free.py
            tests/bonds/test_curve_ddl.py
            tests/bonds/test_curves_resolution.py
            tests/bonds/test_debt_mapping.py
            tests/bonds/test_identifiers.py
            tests/bonds/test_matching.py
            tests/bonds/test_metrics_engine_runner.py
            tests/bonds/test_oas.py
            tests/bonds/test_panel_states.py
            tests/bonds/test_phase10_gate.py
            tests/bonds/test_price_eligibility.py
            tests/bonds/test_price_observations_ddl.py
            tests/bonds/test_price_observations_resolution.py
            tests/bonds/test_pricing.py
            tests/bonds/test_rating_history_ddl.py
            tests/bonds/test_security_master_ddl.py
            tests/bonds/test_security_master_resolution.py
            tests/bonds/test_source_artifact.py
            tests/test_bond_curve_materializer.py
            tests/test_bond_metrics_worker.py
            tests/test_bond_price_eligibility_view.py
            tests/test_bond_price_ingest.py
            tests/test_bond_price_observations_materializer.py
            tests/test_bond_rating_history_materializer.py
            tests/test_bond_security_master_materializer.py
            tests/test_bond_serving_contract.py
            tests/test_bond_serving_materializer.py
            tests/test_bond_serving_worker.py
            tests/test_bond_source_qualify.py
            tests/test_daily_publication_chain.py
            tests/test_daily_publication_chain_wiring.py
            tests/test_ncen_ingestion.py
            tests/test_nport_schema.py
            tests/test_phase10_gate_machine.py
            tests/test_rr1_custom_tag_crosswalk.py
            tests/test_rr1_derived_profiles_materializer.py
            tests/test_rr1_ingestion.py
            tests/test_sec_derived_work_units.py
            tests/test_sec_regulatory_contract.py
            tests/test_sec_regulatory_serving_contract.py
            tests/test_sec_regulatory_serving_materializer.py
            tests/test_sec_source_manifests.py
          )
          printf 'environment_mode=no-dsn\nselected_scope=%s\n' "${tests[*]}"
          printf 'excluded_corpus_only_nodes=%s\n' \
            'test_real_frozen_packages_select_both_metadata_variants,test_canonical_inventory_closes_all_17_real_packages,test_synthetic_submission_package_materializes_all_53_reconciliations,test_real_db_reconciles_candidate_parse_error_and_exponent_decimal'
          env -u SEC_TEST_DATABASE_URL python -m pytest "${tests[@]}" \
            -k 'not test_real_frozen_packages_select_both_metadata_variants and not test_canonical_inventory_closes_all_17_real_packages and not test_synthetic_submission_package_materializes_all_53_reconciliations and not test_real_db_reconciles_candidate_parse_error_and_exponent_decimal' \
            --collect-only -q | tee collect.log
          collected=$(sed -nE 's/^([0-9]+)(\/[0-9]+)? (test|tests|item|items) collected.*$/\1/p' collect.log | tail -1)
          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          env -u SEC_TEST_DATABASE_URL python -m pytest "${tests[@]}" \
            -k 'not test_real_frozen_packages_select_both_metadata_variants and not test_canonical_inventory_closes_all_17_real_packages and not test_synthetic_submission_package_materializes_all_53_reconciliations and not test_real_db_reconciles_candidate_parse_error_and_exponent_decimal' \
            -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          passed=$( (grep -Eo '[0-9]+ passed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          test "$skipped" -gt 0

