      - name: Start disposable N-PORT Timescale database
        if: steps.changes.outputs.nport_changed == 'true'
        run: |
          docker run --detach --name nport-loader-proof --memory 512m --cpus 1 \
            --env POSTGRES_PASSWORD=nport_local_proof --env POSTGRES_DB=nport_proof \
            --publish 127.0.0.1:54329:5432 timescale/timescaledb:2.27.2-pg18 \
            postgres -c shared_buffers=32MB -c work_mem=4MB -c maintenance_work_mem=32MB
          for attempt in {1..30}; do
            # The entrypoint's temporary Unix-socket server precedes database creation.
            # Only the final server accepts TCP connections.
            if docker exec nport-loader-proof pg_isready -h 127.0.0.1 -U postgres -d nport_proof; then break; fi
            sleep 1
          done
          docker exec nport-loader-proof psql -h 127.0.0.1 -U postgres -d nport_proof -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE nport_proof SET nport_loader_proof.disposable = 'on'"

      # The two fund-pipeline contract suites start their own disposable
      # containers with --pull=never; the step above already pulled the same
      # timescale/timescaledb:2.27.2-pg18 image onto this runner.
      - name: Verify N-PORT atomic loader on TimescaleDB 2.27.2 / PostgreSQL 18
        if: steps.changes.outputs.nport_changed == 'true'
        env:
          NPORT_TEST_DATABASE_URL: postgresql://postgres:nport_local_proof@127.0.0.1:54329/nport_proof
          NPORT_LOOKTHROUGH_STAGING_DB_TEST: "1"
          NPORT_CAGG_REFRESH_DB_TEST: "1"
