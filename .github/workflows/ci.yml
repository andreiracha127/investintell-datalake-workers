          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          env -u SEC_TEST_DATABASE_URL python -m pytest "${tests[@]}" \
            -k 'not test_real_frozen_packages_select_both_metadata_variants and not test_canonical_inventory_closes_all_17_real_packages and not test_synthetic_submission_package_materializes_all_53_reconciliations and not test_real_db_reconciles_candidate_parse_error_and_exponent_decimal and not test_cusip_identities_require_the_same_qualified_map_row_as_tickers_and_returns' \
            -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          passed=$( (grep -Eo '[0-9]+ passed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          test "$skipped" -gt 0

  workers-new-surfaces-postgres:
    name: workers-new-surfaces-postgres
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SEC_TEST_DATABASE_URL: host=127.0.0.1 port=65431 dbname=postgres user=postgres
      # Loopback + a database name containing 'disposable' + an explicit password satisfy the bond default-event
      # DB-suite guard (the service uses trust auth, so the password value is ignored).
      BOND_DEFAULT_TEST_DATABASE_URL: host=127.0.0.1 port=65431 dbname=bdefault_disposable_ci user=postgres password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 65431:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
