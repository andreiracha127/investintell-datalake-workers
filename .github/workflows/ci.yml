  # The app vendors investintell-quant-core, so that wheel is production code.
  # It is published from here and nowhere else: only this job — gated on a push
  # to main, after quant-engine went green — holds a token that can write a
  # release, and the preflight refuses to upload anything the checked-out
  # source cannot rebuild. Each version lands once, as the wheel asset of the
  # release tagged quant-core-v<version> on this repository.
  #
  # Until 2026-08 the target was a private Google Artifact Registry index. That
  # GCP project was decommissioned with the move to Railway; from 2026-08-10 the
  # registry answered every authenticated read with 403 and this job was red on
  # every push to main while nothing consumed the index any more.
  quant-core-publish:
    name: quant-core-publish
    runs-on: ubuntu-latest
    needs: quant-engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0

      # Builds the wheel, proves it carries exactly the tracked source of this
      # commit, and compares it against the release. If the version is already
      # published but no longer reproduces from main, this fails instead of
      # publishing — that is the drift the manual builds used to introduce.
      - name: Preflight the wheel against the published releases
        id: preflight
        run: >-
          python scripts/ci/publish_quant_core.py preflight
          --outdir dist/quant-core
          --github-output "$GITHUB_OUTPUT"

      # `gh release create` makes a draft, uploads into it and publishes it
      # last, so a run cancelled midway (concurrency cancels in-progress runs on
      # the next push) leaves a draft, possibly with a partial or even complete
      # asset. The preflight reads a draft as unpublished; `gh release view`
      # still finds it, so the recovery branch replaces the asset and then
      # publishes the draft, pinning the tag to this commit — the one whose
      # source the uploaded wheel was verified against.
      - name: Publish the verified wheel as a release asset
        if: steps.preflight.outputs.publish_needed == 'true'
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          TAG: ${{ steps.preflight.outputs.tag }}
          WHEEL: ${{ steps.preflight.outputs.wheel }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$WHEEL" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$WHEEL" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "investintell-quant-core ${VERSION}" \
              --notes "investintell-quant-core ${VERSION}, built from ${GITHUB_SHA} and verified to carry exactly the tracked source of that commit."
          fi

      # Re-reads the release and re-runs the comparison, so a green job means
      # the artifact the app vendors is the one main builds.
      - name: Confirm the published artifact reproduces from main
        if: steps.preflight.outputs.publish_needed == 'true'
        run: >-
          python scripts/ci/publish_quant_core.py preflight
          --outdir dist/quant-core-confirm
          --require-published
