            tests/test_repair_fund_identity_sec_v1_db.py
            tests/test_rr1_effective_views.py
            tests/test_rr1_fee_profiles.py
            tests/test_sec_derived_publications.py
            tests/test_sec_regulatory_mandate.py
            tests/test_bond_default_publication_db.py
            tests/test_bond_default_diagnostic_publication_db.py
            tests/test_repair_fund_catalog_identity_v1_db.py
            tests/test_bond_default_source_bundle.py
            tests/test_bond_default_events_worker.py
            tests/test_bond_panel_returns_tombstone_db.py
            tests/test_db_advisory_lock.py
            tests/test_nport_fixed_income_features_contract.py
            tests/test_nport_fixed_income_secapi_schema.py
            tests/test_nport_fixed_income_secapi_fallback_schema.py
          )
          printf 'environment_mode=postgres\nselected_scope=%s\n' "${tests[*]}"
          printf 'excluded_corpus_only_nodes=%s\n' \
            'test_real_frozen_packages_select_both_metadata_variants,test_canonical_inventory_closes_all_17_real_packages,test_synthetic_submission_package_materializes_all_53_reconciliations,test_real_db_reconciles_candidate_parse_error_and_exponent_decimal'
          python -m pytest "${tests[@]}" \
            -k 'not test_real_frozen_packages_select_both_metadata_variants and not test_canonical_inventory_closes_all_17_real_packages and not test_synthetic_submission_package_materializes_all_53_reconciliations and not test_real_db_reconciles_candidate_parse_error_and_exponent_decimal' \
            --collect-only -q | tee collect.log
          collected=$(sed -nE 's/^([0-9]+)(\/[0-9]+)? (test|tests|item|items) collected.*$/\1/p' collect.log | tail -1)
          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          python -m pytest "${tests[@]}" \
            -k 'not test_real_frozen_packages_select_both_metadata_variants and not test_canonical_inventory_closes_all_17_real_packages and not test_synthetic_submission_package_materializes_all_53_reconciliations and not test_real_db_reconciles_candidate_parse_error_and_exponent_decimal' \
            -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          passed=$( (grep -Eo '[0-9]+ passed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          url_dsn_tests=(
            tests/test_sec_derived_work_units.py
          )
          printf 'url_dsn_scope=%s\n' "${url_dsn_tests[*]}"
          SEC_TEST_DATABASE_URL='postgresql://postgres@127.0.0.1:65431/postgres' \
            python -m pytest "${url_dsn_tests[@]}" --collect-only -q | tee url-dsn-collect.log
          url_dsn_collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' url-dsn-collect.log | tail -1)
          url_dsn_collected=${url_dsn_collected:-0}
          printf 'url_dsn_collected_count=%s\n' "$url_dsn_collected"
          test "$url_dsn_collected" -gt 0
          set +e
          SEC_TEST_DATABASE_URL='postgresql://postgres@127.0.0.1:65431/postgres' \
            python -m pytest "${url_dsn_tests[@]}" -q -rA | tee url-dsn-results.log
          url_dsn_status=${PIPESTATUS[0]}
          set -e
          url_dsn_passed=$( (grep -Eo '[0-9]+ passed' url-dsn-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          url_dsn_failed=$( (grep -Eo '[0-9]+ failed' url-dsn-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'url_dsn_executed_count=%s url_dsn_failures=%s\n' "$((url_dsn_passed + url_dsn_failed))" "$url_dsn_failed"
          test "$url_dsn_status" -eq 0
          test "$url_dsn_passed" -gt 0
          printf 'database_scope=%s\n' "${db_tests[*]}"
          python -m pytest "${db_tests[@]}" --collect-only -q | tee db-collect.log
          db_collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' db-collect.log | tail -1)
          db_collected=${db_collected:-0}
          printf 'database_collected_count=%s\n' "$db_collected"
          test "$db_collected" -gt 0
          set +e
          python -m pytest "${db_tests[@]}" -q -rA | tee db-results.log
          db_status=${PIPESTATUS[0]}
          set -e
          db_passed=$( (grep -Eo '[0-9]+ passed' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_failed=$( (grep -Eo '[0-9]+ failed' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_skipped=$( (grep -Eo '[0-9]+ skipped' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_executed=$((db_passed + db_failed))
          printf 'database_executed_count=%s database_failures=%s database_skips=%s\n' "$db_executed" "$db_failed" "$db_skipped"
          test "$db_status" -eq 0
          test "$db_executed" -gt 0
          declare -A db_scope_tests=(
            [mixed]=tests/test_mixed_quant_publication.py
            [sec]=tests/test_sec_regulatory_serving_materializer.py
            [ncen]=tests/test_ncen_effective_views.py
            [rr1]=tests/test_rr1_derived_profiles_materializer.py
            [bonds]=tests/test_bond_serving_materializer.py
            [daily_chain]=tests/test_daily_publication_chain.py
            [phase10]=tests/test_phase10_gate_machine.py
          )
          for scope in mixed sec ncen rr1 bonds daily_chain phase10; do
            test_path=${db_scope_tests[$scope]}
            printf 'database_scope_%s=%s\n' "$scope" "$test_path"
            python -m pytest "$test_path" --collect-only -q | tee "$scope-collect.log"
            scope_collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' "$scope-collect.log" | tail -1)
            scope_collected=${scope_collected:-0}
            printf 'database_scope_%s_collected_count=%s\n' "$scope" "$scope_collected"
            test "$scope_collected" -gt 0
            set +e
            python -m pytest "$test_path" -q -rA | tee "$scope-results.log"
            scope_status=${PIPESTATUS[0]}
            set -e
            scope_passed=$( (grep -Eo '[0-9]+ passed' "$scope-results.log" || true) | awk '{sum += $1} END {print sum + 0}')
            scope_failed=$( (grep -Eo '[0-9]+ failed' "$scope-results.log" || true) | awk '{sum += $1} END {print sum + 0}')
            scope_executed=$((scope_passed + scope_failed))
            printf 'database_scope_%s_executed_count=%s database_scope_%s_failures=%s\n' "$scope" "$scope_executed" "$scope" "$scope_failed"
            test "$scope_status" -eq 0
            test "$scope_executed" -gt 0
          done

  # The NAV W1 gate needs the production engine: PostgreSQL 18 with TimescaleDB
  # 2.27.2. These suites never skip; they refuse any other server, so plain
  # postgres:16 cannot run them. They cover hypertable compression, the
  # compressed-chunk DML regression (PR #162), policy publication and the
  # readiness lifecycle. Two shards, one server each, keep the job about as
  # long as the other lanes.
  workers-nav-timescale:
    name: workers-nav-timescale (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: readiness
            tests: tests/test_fund_nav_readiness_db.py
            required_node: tests/test_fund_nav_readiness_db.py::test_compressed_chunk_dml_stays_segment_scoped_across_prepared_statements
          - shard: policy-lifecycle
            tests: >-
              tests/test_fund_nav_access_profile_db.py
              tests/test_nav_economic_rebase_db.py
              tests/test_nav_rebase_cohort_db.py
              tests/test_nav_return_lineage_repair_db.py
              tests/test_instrument_ingestion.py
              tests/test_nav_snapshot_lifecycle_db.py
              tests/test_nav_provider_session_db.py
              tests/test_nav_policy_publication_batch_db.py
              tests/test_generate_fund_nav_policy_v1_db.py
              tests/test_risk_metrics_peer_cohort_guard.py
            required_node: ""
          - shard: eod-foreign-coverage
            tests: tests/test_eod_foreign_listing_coverage_db.py
            required_node: tests/test_eod_foreign_listing_coverage_db.py::test_history_insert_into_compressed_chunks_decompresses_no_batch
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      NAV_W1_TEST_DSN: host=127.0.0.1 port=65432 dbname=nav_readiness_w1_ci user=postgres
      NAV_POLICY_TEST_DSN: host=127.0.0.1 port=65432 dbname=nav_policy_test_ci user=postgres
      EOD_COVERAGE_TEST_DSN: host=127.0.0.1 port=65432 dbname=eod_coverage_ci user=postgres
    services:
      timescale:
        image: timescale/timescaledb:2.27.2-pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TIMESCALEDB_TELEMETRY: "off"
          TS_TUNE_MEMORY: 2GB
        ports:
          - 65432:5432
        # TCP, not the socket: the init-time server listens on the socket only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements.quant-engine.lock pytest

      - name: Provision the disposable TimescaleDB fixtures
        shell: bash
        run: |
          python - <<'PY'
          import time

          import psycopg

          base = "host=127.0.0.1 port=65432 user=postgres"
          for _ in range(30):
              try:
                  admin = psycopg.connect(f"{base} dbname=postgres", autocommit=True)
                  break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("the TimescaleDB service never accepted connections")
          databases = (
              "nav_readiness_w1_ci",
              "nav_policy_test_ci",
              "nav_schema_compat_ci",
              "sec_roles_disposable_ci",
              "eod_coverage_ci",
          )
          with admin:
              # Cluster fixture roles the suites expect but never create.
              for role in ("app_runtime", "worker_writer"):
                  admin.execute(f"CREATE ROLE {role} NOLOGIN")
              for name in databases:
                  admin.execute(f"CREATE DATABASE {name}")
              admin.execute(
                  "ALTER DATABASE nav_schema_compat_ci SET nav_schema_compat.disposable = 'on'"
              )
          for name in databases:
              with psycopg.connect(f"{base} dbname={name}", autocommit=True) as conn:
                  conn.execute("CREATE EXTENSION IF NOT EXISTS timescaledb")
                  conn.execute("CREATE EXTENSION IF NOT EXISTS pgcrypto")
                  version, extension = conn.execute(
                      "SELECT current_setting('server_version_num'), "
                      "(SELECT extversion FROM pg_extension WHERE extname = 'timescaledb')"
                  ).fetchone()
                  print(f"{name}: server_version_num={version} timescaledb={extension}")
                  assert version.startswith("18") and extension == "2.27.2", (version, extension)
          PY

      - name: Run the NAV W1 suites on TimescaleDB
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TESTS: ${{ matrix.tests }}
          REQUIRED_NODE: ${{ matrix.required_node }}
        run: |
          set -euo pipefail
          # A skip here means a DB gate was not evaluated, so skips fail the lane.
          run_suite() {
            local label=$1 collected status summary passed failed skipped
            shift
            printf '%s_scope=%s\n' "$label" "$*"
            python -m pytest "$@" --collect-only -q | tee "$label-collect.log"
            collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' "$label-collect.log" | tail -1)
            collected=${collected:-0}
            printf '%s_collected_count=%s\n' "$label" "$collected"
            test "$collected" -gt 0
            set +e
            python -m pytest "$@" -q -rA | tee "$label-results.log"
            status=${PIPESTATUS[0]}
            set -e
            summary=$(tail -n 1 "$label-results.log")
            passed=$( (grep -Eo '[0-9]+ passed' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
            failed=$( (grep -Eo '[0-9]+ failed' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
            skipped=$( (grep -Eo '[0-9]+ skipped' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
            printf '%s_executed_count=%s %s_failures=%s %s_skips=%s\n' \
              "$label" "$((passed + failed))" "$label" "$failed" "$label" "$skipped"
            test "$status" -eq 0
            test "$((passed + failed))" -gt 0
            test "$skipped" -eq 0
          }
          read -r -a tests <<< "$SHARD_TESTS"
          run_suite nav_w1 "${tests[@]}"
          if [ -n "$REQUIRED_NODE" ]; then
            grep -Fx "PASSED $REQUIRED_NODE" nav_w1-results.log
          fi
          if [ "$SHARD" = policy-lifecycle ]; then
            export SEC_TEST_DATABASE_URL='host=127.0.0.1 port=65432 dbname=nav_schema_compat_ci user=postgres'
            run_suite nav_schema_compat tests/test_nav_timeseries_provenance_schema_db.py
            # Needs the worker_writer fixture role, which only this lane creates.
            export SEC_TEST_DATABASE_URL='host=127.0.0.1 port=65432 dbname=sec_roles_disposable_ci user=postgres'
            run_suite sec_roles tests/test_bond_market_implied_rating_materializer_db.py
          fi

  # W1 and W1b (the SEC ticker -> CIK history and its insider evidence) run on
  # the production engine: PostgreSQL 18.4 with TimescaleDB 2.27.2 on Alpine,
  # database collation en_US.utf8, which musl orders by bytes ('BRK-A' before
  # 'BRK34'; glibc's postgres:16 orders it linguistically, 360242f). With their
  # DSNs set these suites never skip, so a skip fails the lane.
  workers-sec-ticker-timescale:
    name: workers-sec-ticker-timescale
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SEC_TEST_DATABASE_URL: host=127.0.0.1 port=65433 dbname=sec_ticker_ci user=postgres
      SEC_INSIDER_TEST_DSN: host=127.0.0.1 port=65433 dbname=sec_ticker_ci user=postgres
    services:
      timescale:
        image: timescale/timescaledb:2.27.2-pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
          TIMESCALEDB_TELEMETRY: "off"
          TS_TUNE_MEMORY: 2GB
        ports:
          - 65433:5432
        # TCP, not the socket: the init-time server listens on the socket only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements.quant-engine.lock pytest

      - name: Provision the disposable database on the production engine
        shell: bash
        run: |
          python - <<'PY'
          import time

          import psycopg

          base = "host=127.0.0.1 port=65433 user=postgres"
          for _ in range(30):
              try:
                  admin = psycopg.connect(f"{base} dbname=postgres", autocommit=True)
                  break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("the TimescaleDB service never accepted connections")
          with admin:
              admin.execute("CREATE DATABASE sec_ticker_ci")
          with psycopg.connect(f"{base} dbname=sec_ticker_ci", autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS timescaledb")
              row = conn.execute(
                  "SELECT current_setting('server_version_num'), version(), "
                  "(SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'), "
                  "datcollate, datctype, datlocprovider, 'BRK-A' < 'BRK34' "
                  "FROM pg_database WHERE datname = current_database()"
              ).fetchone()
              print("sec_ticker_ci: server_version_num={} ({}) timescaledb={} "
                    "collate={} ctype={} provider={} byte_order={}".format(*row))
              version, banner, extension, collate, ctype, provider, byte_order = row
              assert version.startswith("18") and "musl" in banner, (version, banner)
              assert extension == "2.27.2", extension
              assert (collate, ctype, provider) == ("en_US.utf8", "en_US.utf8", "c"), row
              assert byte_order is True, "en_US.utf8 must order text as production does"
          PY

      - name: Run the SEC W1 and W1b suites on TimescaleDB
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_sec_ticker_cik_history.py
            tests/test_sec_ticker_cik_history_v3.py
            tests/test_sec_insider_ticker_evidence.py
            tests/test_sec_provider_transport.py
            tests/test_sec_loader_transport.py
          )
          printf 'environment_mode=timescale-pg18\nselected_scope=%s\n' "${tests[*]}"
          python -m pytest "${tests[@]}" --collect-only -q | tee collect.log
          collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' collect.log | tail -1)
          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          python -m pytest "${tests[@]}" -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          summary=$(tail -n 1 results.log)
          passed=$( (grep -Eo '[0-9]+ passed' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' <<< "$summary" || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          test "$((passed + failed))" -gt 0
          test "$skipped" -eq 0

  quant-engine:
    name: quant-engine
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:packages/investintell_quant_core/src:services/quant_engine/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/classify_changes.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Record documentation-only validation
        if: >-
          steps.changes.outputs.nport_changed == 'false' &&
          steps.changes.outputs.quant_changed == 'false'
        run: echo "No governed N-PORT or quant compute surface changed."

      - name: Install dependencies
        if: >-
          steps.changes.outputs.nport_changed == 'true' ||
          steps.changes.outputs.quant_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.quant-engine.lock pytest pytest-xdist==3.8.0 ruff==0.15.9 build==1.5.0

      - name: Validate Railway dependencies
        if: steps.changes.outputs.nport_changed == 'true'
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt

      # Runs on every branch, without credentials: any pull request that would
      # make the wheel diverge from its own source fails here, long before the
      # publish job on main gets a token.
      - name: Verify quant-core wheel reproduces its source
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/ci/publish_quant_core.py verify

      - name: Verify quant requirements lock
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/ci/verify_quant_requirements.py

      - name: Run focused N-PORT tests
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          python -m pytest
          tests/test_characteristics_pipeline.py
          tests/test_ci_path_scope.py
