      - name: Remove disposable N-PORT Timescale database
        if: always() && steps.changes.outputs.nport_changed == 'true'
        run: docker rm --force nport-loader-proof

      - name: Verify certified input pack
        if: steps.changes.outputs.quant_changed == 'true'
        run: python docker/railway-ci/verify_input_pack.py

      # The registry DECLARES each certified pack's identity; this recomputes
      # every declared digest from the committed pack tree. The sha256 pins are
      # anti-forgery scaffolding and stay mandatory — the registry only removed
      # the need to retype them in five files.
      - name: Verify certified input pack registry
