name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workers-new-surfaces-no-dsn:
    name: workers-new-surfaces-no-dsn
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements.quant-engine.lock pytest

      - name: Compile mixed production modules
        run: >-
          python -m compileall -q
          scripts/verify_mixed_quant_contract.py
          src/db.py
          src/nport
          src/quant_data
          src/run.py
          src/run_worker.py
          src/sec_regulatory
          src/workers/mixed_quant_publication.py
          src/workers/nport_v2_lookthrough.py
          src/workers/sec_class_factors.py
          src/workers/sec_class_peers_scoring.py
          src/workers/sec_class_shadow_readiness.py

      - name: Run mixed tests without a database DSN
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_mixed_quant_contract_version.py
            tests/test_mixed_quant_contracts.py
            tests/test_mixed_quant_factor_inputs.py
            tests/test_mixed_quant_integration_fixture.py
            tests/test_mixed_quant_publication.py
            tests/test_nport_ingestion.py
            tests/test_nport_v2_lookthrough.py
            tests/test_sec_class_factors.py
            tests/test_sec_class_peers_scoring.py
            tests/test_sec_class_shadow_readiness.py
          )
          printf 'environment_mode=no-dsn\nselected_scope=%s\n' "${tests[*]}"
          env -u SEC_TEST_DATABASE_URL python -m pytest "${tests[@]}" --collect-only -q | tee collect.log
          collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' collect.log | tail -1)
          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          env -u SEC_TEST_DATABASE_URL python -m pytest "${tests[@]}" -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          passed=$( (grep -Eo '[0-9]+ passed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          test "$skipped" -gt 0

  workers-new-surfaces-postgres:
    name: workers-new-surfaces-postgres
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SEC_TEST_DATABASE_URL: host=127.0.0.1 port=65431 dbname=postgres user=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 65431:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements.quant-engine.lock pytest

      - name: Compile mixed production modules
        run: >-
          python -m compileall -q
          scripts/verify_mixed_quant_contract.py
          src/db.py
          src/nport
          src/quant_data
          src/run.py
          src/run_worker.py
          src/sec_regulatory
          src/workers/mixed_quant_publication.py
          src/workers/nport_v2_lookthrough.py
          src/workers/sec_class_factors.py
          src/workers/sec_class_peers_scoring.py
          src/workers/sec_class_shadow_readiness.py

      - name: Run mixed tests with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_mixed_quant_contract_version.py
            tests/test_mixed_quant_contracts.py
            tests/test_mixed_quant_factor_inputs.py
            tests/test_mixed_quant_integration_fixture.py
            tests/test_mixed_quant_publication.py
            tests/test_nport_composition_features.py
            tests/test_nport_fixed_income_features.py
            tests/test_nport_holdings_v2.py
            tests/test_nport_ingestion.py
            tests/test_nport_v2_lookthrough.py
            tests/test_sec_class_factors.py
            tests/test_sec_class_peers_scoring.py
            tests/test_sec_class_shadow_readiness.py
          )
          db_tests=(
            tests/test_mixed_quant_factor_inputs.py
            tests/test_mixed_quant_integration_fixture.py
            tests/test_mixed_quant_publication.py
            tests/test_nport_composition_features.py
            tests/test_nport_fixed_income_features.py
            tests/test_nport_holdings_v2.py
          )
          printf 'environment_mode=postgres\nselected_scope=%s\n' "${tests[*]}"
          python -m pytest "${tests[@]}" --collect-only -q | tee collect.log
          collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' collect.log | tail -1)
          collected=${collected:-0}
          printf 'collected_count=%s\n' "$collected"
          test "$collected" -gt 0
          set +e
          python -m pytest "${tests[@]}" -q -rA | tee results.log
          status=${PIPESTATUS[0]}
          set -e
          passed=$( (grep -Eo '[0-9]+ passed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          failed=$( (grep -Eo '[0-9]+ failed' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          skipped=$( (grep -Eo '[0-9]+ skipped' results.log || true) | awk '{sum += $1} END {print sum + 0}')
          printf 'executed_count=%s failures=%s skips=%s\n' "$((passed + failed))" "$failed" "$skipped"
          test "$status" -eq 0
          printf 'database_scope=%s\n' "${db_tests[*]}"
          python -m pytest "${db_tests[@]}" --collect-only -q | tee db-collect.log
          db_collected=$(sed -nE 's/^([0-9]+) (test|tests|item|items) collected.*$/\1/p' db-collect.log | tail -1)
          db_collected=${db_collected:-0}
          printf 'database_collected_count=%s\n' "$db_collected"
          test "$db_collected" -gt 0
          set +e
          python -m pytest "${db_tests[@]}" -q -rA | tee db-results.log
          db_status=${PIPESTATUS[0]}
          set -e
          db_passed=$( (grep -Eo '[0-9]+ passed' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_failed=$( (grep -Eo '[0-9]+ failed' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_skipped=$( (grep -Eo '[0-9]+ skipped' db-results.log || true) | awk '{sum += $1} END {print sum + 0}')
          db_executed=$((db_passed + db_failed))
          printf 'database_executed_count=%s database_failures=%s database_skips=%s\n' "$db_executed" "$db_failed" "$db_skipped"
          test "$db_status" -eq 0
          test "$db_executed" -gt 0

  quant-engine:
    name: quant-engine
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:packages/investintell_quant_core/src:services/quant_engine/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/classify_changes.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Record documentation-only validation
        if: >-
          steps.changes.outputs.nport_changed == 'false' &&
          steps.changes.outputs.quant_changed == 'false'
        run: echo "No governed N-PORT or quant compute surface changed."

      - name: Install dependencies
        if: >-
          steps.changes.outputs.nport_changed == 'true' ||
          steps.changes.outputs.quant_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.quant-engine.lock pytest pytest-xdist==3.8.0 ruff==0.15.9

      - name: Validate Railway dependencies
        if: steps.changes.outputs.nport_changed == 'true'
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt

      - name: Verify Stage A binding
        if: steps.changes.outputs.quant_changed == 'true'
        run: >-
          python -m pytest
          tests/test_direct_activation_stage_a.py::test_reproducibility_record_pins_a_clean_16_run_reproduction
          -q

      - name: Verify quant requirements lock
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/ci/verify_quant_requirements.py

      - name: Run focused N-PORT tests
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          python -m pytest
          tests/test_nport_lookthrough.py
          tests/test_nport_cusip_enrichment.py
          tests/test_openfigi.py
          tests/test_yahoo_sector.py
          tests/test_backfill_nport_holding_attributes.py
          tests/test_load_nport_fund_flows.py
          -q

      - name: Lint N-PORT modules
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          ruff check
          src/workers/nport_lookthrough.py
          src/workers/nport_cusip_enrichment.py
          src/workers/_openfigi.py
          src/workers/_yahoo_sector.py
          scripts/backfill_nport_holding_attributes.py
          scripts/load_nport_fund_flows.py
          tests/test_nport_lookthrough.py
          tests/test_nport_cusip_enrichment.py
          tests/test_openfigi.py
          tests/test_yahoo_sector.py
          tests/test_backfill_nport_holding_attributes.py
          tests/test_load_nport_fund_flows.py

      - name: Compile N-PORT modules
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          python -m compileall -q
          src/workers/nport_lookthrough.py
          src/workers/nport_cusip_enrichment.py
          src/workers/_openfigi.py
          src/workers/_yahoo_sector.py
          scripts/backfill_nport_holding_attributes.py
          scripts/load_nport_fund_flows.py

      - name: Verify certified input pack
        if: steps.changes.outputs.quant_changed == 'true'
        run: python docker/railway-ci/verify_input_pack.py

      - name: Verify contract bundle
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/contract_bundle.py verify

      - name: Verify contract bundle v2
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/contract_bundle.py verify --bundle-dir contracts/quant-engine/v2

      - name: Run governance and quant-engine tests
        if: steps.changes.outputs.quant_changed == 'true'
        run: >-
          python -m pytest
          tests/input_packs
          tests/quant_engine
          tests/quant_core
          tests/test_calibration_candidate.py
          tests/test_qc_a3_core.py
          tests/test_catalog_hash_path_independence.py
          tests/test_repeatability_matrix.py
          tests/test_shadow_readiness.py
          tests/test_shadow_pilot.py
          tests/test_a5_preflight_readiness.py
          tests/test_runtime_integration_skeleton.py
          tests/test_external_executor_handshake.py
          tests/test_controlled_shadow.py
          tests/test_controlled_activation_proposal.py
          tests/test_phase0q_quant_evidence.py
          tests/test_phase0q_supplement.py
          tests/test_p1_export.py
          tests/test_macro_ingestion.py
          tests/test_contract_metric_backtest.py
          tests/test_p1_pack.py
          tests/test_quant_requirements_sync.py
          tests/test_remote_ci_runner.py
          tests/test_ci_path_scope.py
          tests/test_stage_a_compute_manifest.py
          tests/test_phase0q_harness.py
          tests/test_phase0q_gate_amendments.py
          tests/test_compression_grid.py
          tests/test_phase0q_cloud_leg.py
          tests/test_cloud_backtest_import_guard.py
          tests/test_cloud_backtest_runner.py
          tests/test_phase0q_reproducibility_evidence.py
          tests/test_phase0q_004_amendments.py
          tests/test_threshold_signoff.py
          tests/test_dark_launch_readiness.py
          tests/test_direct_activation_plan.py
          tests/test_direct_activation_stage_a.py
          -p xdist.plugin
          -n auto
          --dist loadscope
          --color=no
          -q

      - name: Compile Python modules
        if: steps.changes.outputs.quant_changed == 'true'
        run: >-
          python -m compileall
          src/calibration_candidate.py
          src/shadow_pilot.py
          src/input_packs
          scripts/ci/verify_quant_requirements.py
          services/quant_engine
          packages/investintell_quant_core
          harness/phase0q_cloud/backtest_main.py
          harness/phase0q_cloud/run_cloud_backtest.py

      - name: Verify calibration artifacts
        if: steps.changes.outputs.quant_changed == 'true'
        run: python docker/railway-ci/verify_calibration_artifacts.py
