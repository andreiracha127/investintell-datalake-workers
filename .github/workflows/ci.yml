  quant-engine:
    name: quant-engine
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:packages/investintell_quant_core/src:services/quant_engine/src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/classify_changes.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Record documentation-only validation
        if: >-
          steps.changes.outputs.nport_changed == 'false' &&
          steps.changes.outputs.quant_changed == 'false'
        run: echo "No governed N-PORT or quant compute surface changed."

      - name: Install dependencies
        if: >-
          steps.changes.outputs.nport_changed == 'true' ||
          steps.changes.outputs.quant_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.quant-engine.lock pytest pytest-xdist==3.8.0 ruff==0.15.9 build==1.5.0

      - name: Validate Railway dependencies
        if: steps.changes.outputs.nport_changed == 'true'
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt

      # Runs on every branch, without credentials: any pull request that would
      # make the wheel diverge from its own source fails here, long before the
      # publish job on main gets a token.
      - name: Verify quant-core wheel reproduces its source
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/ci/publish_quant_core.py verify

      - name: Verify quant requirements lock
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/ci/verify_quant_requirements.py

      - name: Run focused N-PORT tests
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          python -m pytest
          tests/test_nport_lookthrough.py
          tests/test_nport_identifier_coverage.py
          tests/test_nport_cusip_enrichment.py
          tests/test_openfigi.py
          tests/test_yahoo_sector.py
          tests/test_backfill_nport_holding_attributes.py
          tests/test_load_nport_fund_flows.py
          -q

      - name: Lint N-PORT modules
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          ruff check
          src/workers/nport_lookthrough.py
          src/workers/nport_identifier_coverage.py
          src/workers/nport_cusip_enrichment.py
          src/workers/_openfigi.py
          src/workers/_yahoo_sector.py
          scripts/backfill_nport_holding_attributes.py
          scripts/load_nport_fund_flows.py
          tests/test_nport_lookthrough.py
          tests/test_nport_identifier_coverage.py
          tests/test_nport_cusip_enrichment.py
          tests/test_openfigi.py
          tests/test_yahoo_sector.py
          tests/test_backfill_nport_holding_attributes.py
          tests/test_load_nport_fund_flows.py

      - name: Compile N-PORT modules
        if: steps.changes.outputs.nport_changed == 'true'
        run: >-
          python -m compileall -q
          src/workers/nport_lookthrough.py
          src/workers/nport_identifier_coverage.py
          src/workers/nport_cusip_enrichment.py
          src/workers/_openfigi.py
          src/workers/_yahoo_sector.py
          scripts/backfill_nport_holding_attributes.py
          scripts/load_nport_fund_flows.py

      - name: Verify certified input pack
        if: steps.changes.outputs.quant_changed == 'true'
        run: python docker/railway-ci/verify_input_pack.py

      # The registry DECLARES each certified pack's identity; this recomputes
      # every declared digest from the committed pack tree. The sha256 pins are
      # anti-forgery scaffolding and stay mandatory — the registry only removed
      # the need to retype them in five files.
      - name: Verify certified input pack registry
        if: steps.changes.outputs.quant_changed == 'true'
        run: python -m src.input_packs.registry verify

      - name: Verify contract bundle
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/contract_bundle.py verify

      - name: Verify contract bundle v2
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/contract_bundle.py verify --bundle-dir contracts/quant-engine/v2

      - name: Verify contract bundle v3
        if: steps.changes.outputs.quant_changed == 'true'
        run: python scripts/contract_bundle.py verify --bundle-dir contracts/quant-engine/v3

      # The per-PR gate runs the suites that can still fail because of THIS
      # commit: the current worker, contract, pack, PIT/staleness, publication
      # and rollback surfaces. The frozen pre-activation evidence replay (shadow,
      # pilot, external handshake, controlled shadow/activation, dark launch, A5
      # preflight, runtime skeleton, direct-activation plan) is marked
      # ``preactivation`` and runs in preactivation-evidence.yml instead. The
      # ``-m "not preactivation"`` filter is the belt-and-braces: re-adding one of
      # those paths here cannot silently put the ceremony back on the PR path.
      - name: Run governance and quant-engine tests
        if: steps.changes.outputs.quant_changed == 'true'
        run: >-
          python -m pytest
          tests/input_packs
          tests/quant_engine
          tests/quant_core
          tests/test_calibration_candidate.py
          tests/test_qc_a3_core.py
          tests/test_catalog_hash_path_independence.py
          tests/test_repeatability_matrix.py
          tests/test_phase0q_quant_evidence.py
          tests/test_phase0q_supplement.py
          tests/test_p1_export.py
          tests/test_macro_ingestion.py
          tests/test_contract_metric_backtest.py
          tests/test_representable_activation.py
          tests/test_p1_pack.py
          tests/test_input_pack_registry.py
          tests/test_quant_requirements_sync.py
          tests/test_remote_ci_runner.py
          tests/test_ci_path_scope.py
          tests/test_preactivation_evidence_scope.py
          tests/test_stage_a_compute_manifest.py
          tests/test_phase0q_harness.py
          tests/test_phase0q_gate_amendments.py
          tests/test_compression_grid.py
          tests/test_phase0q_cloud_leg.py
          tests/test_cloud_backtest_import_guard.py
          tests/test_cloud_backtest_runner.py
          tests/test_phase0q_reproducibility_evidence.py
          tests/test_phase0q_004_amendments.py
          tests/test_threshold_signoff.py
          tests/test_direct_activation_stage_a.py
          tests/test_direct_activation_stage_b.py
          tests/test_open_macro_v03_worker.py
          tests/test_open_macro_v03_monitor.py
          tests/test_open_macro_v4_formula.py
          tests/test_open_macro_v4_golden.py
          tests/test_open_macro_v04_worker.py
          -m "not preactivation"
          -p xdist.plugin
          -n auto
          --dist loadscope
          --color=no
          -q

      - name: Compile Python modules
        if: steps.changes.outputs.quant_changed == 'true'
        run: >-
          python -m compileall
          src/calibration_candidate.py
          src/shadow_pilot.py
          src/input_packs
          scripts/ci/verify_quant_requirements.py
          services/quant_engine
          packages/investintell_quant_core
          harness/phase0q_cloud/backtest_main.py
          harness/phase0q_cloud/run_cloud_backtest.py

      - name: Verify calibration artifacts
        if: steps.changes.outputs.quant_changed == 'true'
        run: python docker/railway-ci/verify_calibration_artifacts.py

  # The app installs investintell-quant-core from a private Artifact Registry
  # index, so that wheel is production code. It is published from here and
  # nowhere else: only this job — gated on a push to main, after quant-engine
  # went green — can mint a token for the publisher service account, and the
  # preflight refuses to upload anything the checked-out source cannot rebuild.
  quant-core-publish:
    name: quant-core-publish
    runs-on: ubuntu-latest
    needs: quant-engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 twine==6.2.0

      - name: Authenticate to Google Artifact Registry
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/552289444247/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gh-actions-gar-publisher@investintell-research-analisys.iam.gserviceaccount.com

      # Builds the wheel, proves it carries exactly the tracked source of this
      # commit, and compares it against the registry. If the version is already
      # published but no longer reproduces from main, this fails instead of
      # publishing — that is the drift the manual builds used to introduce.
      - name: Preflight the wheel against the registry
        id: preflight
        env:
          GAR_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: >-
          python scripts/ci/publish_quant_core.py preflight
          --outdir dist/quant-core
          --github-output "$GITHUB_OUTPUT"

      - name: Publish the verified wheel
        if: steps.preflight.outputs.publish_needed == 'true'
        env:
          TWINE_USERNAME: oauth2accesstoken
          TWINE_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: >-
          python -m twine upload
          --repository-url https://southamerica-east1-python.pkg.dev/investintell-research-analisys/python/
          --non-interactive
          --disable-progress-bar
          dist/quant-core/*.whl

      # Re-reads the index the app resolves against and re-runs the comparison,
      # so a green job means the artifact users install is the one main builds.
      - name: Confirm the published artifact reproduces from main
        if: steps.preflight.outputs.publish_needed == 'true'
        env:
          GAR_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: >-
          python scripts/ci/publish_quant_core.py preflight
          --outdir dist/quant-core-confirm
          --require-published
